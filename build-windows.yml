name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install tidal-wave mutagen pyinstaller pywebview imageio-ffmpeg

      - name: Preparar FFmpeg Windows
        shell: pwsh
        run: |
          python -c "import imageio_ffmpeg,shutil; shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), 'build_windows/ffmpeg.exe')"

      - name: Gerar executável
        shell: pwsh
        run: |
          pyinstaller --distpath build_windows/dist --workpath build_windows/build --noconfirm build_windows/TidalDownloader.spec

      - name: Empacotar artefato
        shell: pwsh
        run: |
          Compress-Archive -Path build_windows/dist/TidalDownloader -DestinationPath TidalDownloader-Windows.zip

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: TidalDownloader-Windows
          path: TidalDownloader-Windows.zip
